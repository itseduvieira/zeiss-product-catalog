apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog-web
  labels:
    app: product-catalog-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-catalog-web
  template:
    metadata:
      labels:
        app: product-catalog-web
    spec:
      containers:
        - name: web
          image: product-catalog-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_URL
              value: http://product-catalog-api:8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
